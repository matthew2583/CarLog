services:
  db:
    image: postgres:16
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "sh", "-c", "pg_isready -U $$POSTGRES_USER"]
      interval: 3s
      retries: 10
    networks:
      - dev_net

  migrate:
    build: .
    command: alembic upgrade head
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dev_net

  backend:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - dev_net

  auth-service:
    build: .
    command: sh -c "exec uvicorn auth_service.app:app --host 0.0.0.0 --port ${AUTH_PORT}"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - dev_net
    
  frontend:
    build: ./frontend
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - dev_net
    
  gateway:
    image: nginx:1.27-alpine
    env_file:
      - .env
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_CONTAINER_PORT}"
    depends_on:
      - backend
      - auth-service
      - frontend
    networks:
      - dev_net
  
networks:
  dev_net:
    driver: bridge

volumes:
  db_data: