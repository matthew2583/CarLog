apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-nginx
  namespace: carlog
data:
  default.conf.template: |
    server {
        listen ${GATEWAY_CONTAINER_PORT};

        location /api/auth/ {
            proxy_pass http://auth-service:${AUTH_PORT}/auth/;
        }

        location /api/ {
            proxy_pass http://backend:${BACKEND_PORT}/;
        }

        location / {
            proxy_pass http://frontend:${FRONTEND_PORT};
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: carlog
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      enableServiceLinks: false
      containers:
        - name: gateway
          image: nginx:1.27-alpine
          envFrom:
            - configMapRef:
                name: carlog-config
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: nginx-template
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
              readOnly: true
      volumes:
        - name: nginx-template
          configMap:
            name: gateway-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: carlog
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080