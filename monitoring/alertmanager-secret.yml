apiVersion: v1
kind: Secret
metadata:
  name: carlog-alertmanager
  namespace: monitoring
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
      smtp_smarthost: "mailhog.monitoring.svc:1025"
      smtp_from: "carlog@local"
      smtp_require_tls: false

    route:
      receiver: carlog-email

    receivers:
      - name: carlog-email
        email_configs:
          - to: "mattflow45@gmail.com"
            send_resolved: true