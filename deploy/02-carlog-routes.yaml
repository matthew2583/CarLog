# Постоянные маршруты CarLog: сервис авторизации и фронтенд (то же, что раньше делал nginx).
# Маршрут /api (backend) вынесен в strategies/ — именно его меняют стратегии деплоя:
# при совпадении префиксов побеждает самый длинный (/api/auth > /api > /).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: carlog
  namespace: carlog
spec:
  parentRefs:
    - name: eg
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/auth
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /auth
      backendRefs:
        - name: auth-service
          port: 8001
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
