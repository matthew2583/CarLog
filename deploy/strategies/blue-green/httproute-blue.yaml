# BLUE/GREEN — мгновенное переключение всего трафика на «синюю» (новую) версию v2.
# Применяем поверх httproute-green.yaml: HTTPRoute тот же (`backend`), меняется
# только backendRef. Откат — так же мгновенно: снова применить green.
# Старая версия v1 остаётся поднятой ещё какое-то время — на случай отката.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend
  namespace: carlog
spec:
  parentRefs:
    - name: eg
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: backend-v2   # blue
          port: 8000
