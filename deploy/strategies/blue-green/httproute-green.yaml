# BLUE/GREEN — весь трафик на «зелёную» (старую) версию v1.
# Обе версии (backend и backend-v2) задеплоены и готовы, но пользователи на v1.
# Переключение на blue — применить httproute-blue.yaml (тот же HTTPRoute `backend`).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend
  namespace: carlog
spec:
  parentRefs:
    - name: eg
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: backend   # green
          port: 8000
