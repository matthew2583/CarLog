# A/B TESTING (справочно, сверх «минимального» набора демо).
# В отличие от canary (дрбление по весу — случайная выборка), A/B направляет
# на новую версию ТОЧНО выбранную аудиторию — здесь по HTTP-заголовку.
# Правило 1: если есть заголовок `x-user-group: beta` -> вся такая публика на v2.
# Правило 2 (по умолчанию): все остальные -> v1.
#
# Проверка:
#   curl -s http://$GW/api/version                              -> "version":"v1.0.0"
#   curl -s -H 'x-user-group: beta' http://$GW/api/version      -> "version":"v2.0.0"
#
# Помимо заголовков Gateway API умеет матчить query-параметры и метод — удобно
# для таргетинга по гео, типу клиента и т.п.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend
  namespace: carlog
spec:
  parentRefs:
    - name: eg
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
          headers:
            - type: Exact
              name: x-user-group
              value: beta
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: backend-v2
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: backend
          port: 8000
