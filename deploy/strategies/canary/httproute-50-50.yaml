# CANARY — шаг 2: 50/50. Применяем, когда метрики v2 на 10% выглядят здоровыми.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend
  namespace: carlog
spec:
  parentRefs:
    - name: eg
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: backend
          port: 8000
          weight: 50
        - name: backend-v2
          port: 8000
          weight: 50
