# CANARY — шаг 1: 90% трафика на стабильную v1, 10% на новую v2.
# В Gateway API дробление делается весами (weight) в backendRefs одного HTTPRoute.
# Дальше постепенно увеличиваем долю v2: 50/50 -> 0/100 (см. соседние файлы).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend
  namespace: carlog
spec:
  parentRefs:
    - name: eg
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: backend
          port: 8000
          weight: 90
        - name: backend-v2
          port: 8000
          weight: 10
