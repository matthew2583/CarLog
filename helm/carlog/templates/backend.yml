apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
  labels:
    app: backend
    version: {{ .Values.backendVersion }}
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
    - name: metrics
      port: 8100
      targetPort: 8100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.backendReplicas }}
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        version: {{ .Values.backendVersion }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8100"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: backend
          image: {{ .Values.backendImage }}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: carlog-config
            - secretRef:
                name: carlog-secrets
          env:
            - name: APP_VERSION
              value: {{ .Values.backendVersion | quote }}
          ports:
            - containerPort: 8000
            - name: metrics
              containerPort: 8100
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: {{ .Values.backendReadyDelay }}
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 500m